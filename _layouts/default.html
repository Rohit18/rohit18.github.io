<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | strip | escape }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/images/me.jpg' | absolute_url }}">
    <meta property="og:image:alt" content="Rohit Mukherjee">
    <meta name="twitter:card" content="summary">
    {% if site.favicon_emoji %}
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>{{ site.favicon_emoji }}</text></svg>">
    {% endif %}
    {% if site.favicon %}
    <link rel="alternate icon" href="{{ site.favicon | relative_url }}">
    {% endif %}
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>
  <body id="top">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <main id="main-content" class="page-content" aria-label="Content">
      <div class="w">
        {{ content }}
      </div>
    </main>
    <script data-goatcounter="https://rohitmukherjee.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
  </body>
</html>
